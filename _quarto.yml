project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - data.qmd
    - quality-control.qmd
    - heatwave.qmd
    - learned.qmd
  resources:
    - figures/*.png
    - images/motif.svg

website:
  title: "BC lightstation sea temperatures"
  favicon: images/favicon.png
  site-url: https://emmabranch.github.io/bc-lightstation-qc/
  repo-url: https://github.com/emmabranch/bc-lightstation-qc
  navbar:
    logo: images/motif.svg
    logo-alt: ""
    left:
      - href: index.qmd
        text: Overview
      - href: data.qmd
        text: Data
      - href: quality-control.qmd
        text: Quality control
      - href: heatwave.qmd
        text: Heatwave
      - href: learned.qmd
        text: What I learned
    right:
      - text: "DOI"
        href: https://doi.org/10.5281/zenodo.24326157
      - icon: github
        href: https://github.com/emmabranch/bc-lightstation-qc
  page-footer:
    center: "Personal project by Emma Branch. Not an official DFO or CIOOS product."

format:
  html:
    theme: [flatly, brand, brand.scss, theme.scss]
    css: styles.css
    include-after-body: footer.html
    code-fold: true
    code-summary: "Show code"

execute:
  freeze: auto
  warning: false
  message: false
